<main>
    <div class="head">
    <h1>Dia da Semana:</h1>
    </div>

    <div class="subMain">
    <div class="dias">
        <button class="inicialDaSemana" *ngFor="let dia of dias" (click)="selecionarDia(dia.id)" 
        [style.background-color]="dia.id === diaAtual?.id ? 'white' : '#f5f5f5'">
            {{ dia.letra }}
        </button>
    </div>
    <div class="conteudo">
        <h3 class="periodoh3">Manhã:</h3>
        <h3>{{ diaAtual?.manha }}</h3>
        <h3 class="periodoh3">Tarde:</h3>
        <h3>{{ diaAtual?.tarde }}</h3>
    </div>
    </div>
</main>
