
<main>
  <h1>Cadastrar cardápio</h1>

  <label for="dia">Dia da semana:</label>

  <select id="dia" [(ngModel)]="novoDia">
    @for (dia of dias; track dia.dia_semana) {
      <option [ngValue]="dia.dia_semana">
        {{ dia.nome }}
      </option>
    }
  </select>

  <label for="refeicao">Refeição:</label>

  <input
    id="refeicao"
    type="text"
    [(ngModel)]="novaRefeicao"
    placeholder="Digite a refeição"
  >

  <button
    type="button"
    (click)="adicionarCardapio()"
    [disabled]="carregando"
  >
    {{ carregando ? 'Cadastrando...' : 'Adicionar' }}
  </button>

  @if (mensagem) {
    <p>{{ mensagem }}</p>
  }

  @if (erro) {
    <p>{{ erro }}</p>
  }

  <h2>Cardápios cadastrados:</h2>

  @for (cardapio of cardapios; track cardapio.id) {
    <div>
      <h3>{{ nomeDia(cardapio.dia_semana) }}</h3>
      <p>{{ cardapio.refeicao }}</p>
    </div>
  } @empty {
    <p>Nenhuma refeição cadastrada.</p>
  }
</main>
